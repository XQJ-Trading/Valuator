id: ceo
name: CEO·리더십 분석
description: 장기 투자 관점에서 CEO·경영진 품질, 조직 문화, 거버넌스를 평가한다.
tools:
  - domain_tool
  - web_search_tool
  - sec_tool
domain_tools:
  - tool: domain_tool
    enabled: true
prompt_file: guide.md
report_contract:
  - CEO/경영진 등급(Excellent/Good/Fair/Poor)과 그 근거를 제시한다.
  - 핵심 리스크 3개와 손익/현금흐름 전이 경로를 제시한다.
  - 투자 관점 결론(긍정/부정 트리거 포함)을 제시한다.
tasks:
  - id: ceo_report
    name: CEO·리더십 분석 리포트
ir:
  summary_path: findings
  key_values:
    subject:
      path: corp
      format: "{}"
      default: CEO / Leadership
  payload_paths:
    corp: corp
    findings: findings
depends_on: []
