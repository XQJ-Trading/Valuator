aspects:
  - id: integrity
    label: 성실성·투명성
    description: 주주와의 소통 이력, 회계 투명성, 약속 이행 기록, 실수 인정과 수정 능력
    priority: high
  - id: capital_allocation
    label: 자본배분 역량
    description: M&A, CAPEX, 주주환원, retained earnings 재투자의 가치 창출 또는 파괴 이력
    priority: high
  - id: governance
    label: 지배구조·이사회 독립성
    description: 이사회 구성, 독립성, 보상 구조, 특수관계자 거래, 규제 대응 태도
    priority: medium
  - id: strategic_vision
    label: 전략적 비전과 실행력
    description: 장기 전략의 일관성, 실행 결과, 경쟁우위 강화 방향, 산업 내 포지셔닝
    priority: medium
  - id: talent_culture
    label: 인재·조직 문화
    description: 혁신 역량, R&D 효과성, 인재 유입과 유지, 윤리 풍토, 의사결정 품질
    priority: low
