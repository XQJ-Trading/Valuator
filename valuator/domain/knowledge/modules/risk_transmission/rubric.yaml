aspects:
  - id: regulatory_risk
    label: 규제·정책 리스크
    description: 반독점, 허가, 정책 변화가 매출, 비용, capex, 현금흐름에 미치는 전이 경로
    priority: high
  - id: demand_risk
    label: 수요·가격 리스크
    description: 수요 둔화, 가격 경쟁, 믹스 변화가 매출총이익과 operating leverage에 미치는 영향
    priority: high
  - id: supply_chain_risk
    label: 공급망·운영 리스크
    description: 조달, 물류, 설비 차질이 COGS, 재고, 운전자본, 서비스 수준에 미치는 영향
    priority: high
  - id: financing_fx_risk
    label: 자금조달·환율 리스크
    description: 금리, 차입, 환율 변동이 이자비용, 수입원가, 현금흐름, 가치평가에 미치는 영향
    priority: medium
  - id: monitoring_triggers
    label: 모니터링 트리거
    description: 감시해야 할 선행지표, 임계치, 재평가 트리거와 대응 포인트
    priority: medium
